name: Rotate fund holdings and deploy Pages

on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:
    inputs:
      shard:
        description: "Optional shard index (0-9)"
        required: false
        type: string
      refresh_universe:
        description: "Refresh the size-ranked 1000-fund universe"
        required: false
        default: false
        type: boolean

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  rotate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"

      - name: Install crawler
        run: python -m pip install -e .

      - name: Run Python tests
        run: python -m unittest discover -s tests -v

      - name: Run browser logic tests
        run: npm run check

      - name: Locate latest deployed Pages artifact
        id: previous-pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=github-pages&per_page=20" --jq '.artifacts | map(select(.expired == false)) | sort_by(.created_at) | reverse | .[0].workflow_run.id // empty')"
          if [ -n "$run_id" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download latest deployed Pages artifact
        if: steps.previous-pages.outputs.available == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: github-pages
          path: .previous-pages
          github-token: ${{ github.token }}
          run-id: ${{ steps.previous-pages.outputs.run_id }}

      - name: Restore latest deployed market and fund data
        if: steps.previous-pages.outputs.available == 'true'
        run: |
          rm -rf public/data
          mkdir -p public/data
          tar -xf .previous-pages/artifact.tar -C public ./data

      - name: Restore immutable fund report cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: .cache/fund-reports
          key: fund-reports-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            fund-reports-${{ runner.os }}-

      - name: Restore durable fund rotation state
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: .cache/fund-state
          key: fund-state-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            fund-state-${{ runner.os }}-

      - name: Restore durable fund state and ensure market context
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f public/data/funds/meta.json ] && [ -f .cache/fund-state/meta.json ]; then
            mkdir -p public/data
            rm -rf public/data/funds
            cp -a .cache/fund-state public/data/funds
          fi
          if [ ! -f public/data/stocks.json ]; then
            if ! ashare-finance --output public/data --since 2021-01-01 --min-interval 0.30 --skip-funds; then
              mkdir -p .snapshot
              if gh release download data-snapshot-2026-11-12 --pattern 'a-share-data-snapshot-*.tar.gz' --dir .snapshot \
                && python -m ashare_finance.restore_live --archive .snapshot/a-share-data-snapshot-2026-11-12.tar.gz \
                  --sha256 0ef1ed9f22d50f7aa9972fa555098d50afa23e366aa4cbd791bc4f1fc130062a --output public/data; then
                echo "Restored verified release snapshot"
              else
                python -m ashare_finance.restore_live --url https://blizzardoner.github.io/a-share-finance/data --output public/data --workers 2
              fi
            fi
            python -c "import json; from pathlib import Path; from ashare_finance.fund_rotation import ensure_empty_fund_state; root=Path('public/data'); generated=json.loads((root/'meta.json').read_text(encoding='utf-8'))['generated_at']; ensure_empty_fund_state(root, generated)"
          fi
          test -f public/data/stocks.json

      - name: Rotate one hundred size-ranked funds
        env:
          ASHARE_FUND_CACHE_DIR: .cache/fund-reports
          MANUAL_SHARD: ${{ inputs.shard }}
          REFRESH_UNIVERSE: ${{ inputs.refresh_universe }}
        run: |
          args=(--data-root public/data --target 1000 --batch-size 100 --min-interval 0.50)
          if [ -n "$MANUAL_SHARD" ]; then args+=(--shard "$MANUAL_SHARD"); fi
          if [ "$REFRESH_UNIVERSE" = "true" ]; then args+=(--refresh-universe); fi
          ashare-funds "${args[@]}"

      - name: Save the updated fund rotation state
        run: |
          rm -rf .cache/fund-state
          mkdir -p .cache/fund-state
          cp -a public/data/funds/. .cache/fund-state/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b  # v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3
        with:
          path: public

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4

      - name: Verify the deployed data matches this build
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: >-
          python -m ashare_finance.verify_pages
          --expected public/data/meta.json
          --url "${PAGE_URL%/}/data/meta.json"
          --expected-funds public/data/funds/meta.json
          --fund-url "${PAGE_URL%/}/data/funds/meta.json"
          --attempts 20
          --delay 15
