<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b1020">
  <meta name="description" content="浏览全部A股上市公司的财务、现金流与分红数据">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="A股透镜">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="stylesheet" href="./styles.css">
  <title>A股透镜 · 财报与分红</title>
</head>
<body>
  <header class="app-header">
    <a class="brand" href="./" aria-label="A股透镜首页"><span class="brand-icon"><i></i><i></i><i></i></span><span><strong>A股透镜</strong><small>FINANCIAL LENS</small></span></a>
    <div class="source-pill"><span></span><b id="data-count">数据加载中</b></div>
  </header>

  <main>
    <section class="intro">
      <p class="eyebrow">A-SHARE INTELLIGENCE</p>
      <h1>一眼看懂公司的<br><em>财务质量与分红。</em></h1>
      <p>覆盖沪深北全部A股，财务指标、现金流、资产负债与历年分红集中浏览。</p>
      <div class="search-wrap">
        <label class="search-box" for="stock-search"><span>⌕</span><input id="stock-search" type="search" placeholder="输入代码、公司名称或拼音" autocomplete="off" enterkeyhint="search" disabled><kbd>搜索</kbd></label>
        <div class="search-results" id="search-results" hidden></div>
      </div>
      <button class="ranking-launch" id="ranking-open" type="button" disabled><span>↗</span><strong>打开全市场排行榜</strong><small>分红率 · 经营业绩 · 1/3/5/10年</small></button>
    </section>

    <section id="loading" class="loading-card"><div class="spinner"></div><strong>正在载入市场数据</strong><span>首次打开只需几秒</span></section>

    <section id="ranking-view" class="ranking-view" hidden>
      <div class="ranking-heading">
        <div><p class="eyebrow">A-SHARE RANKING</p><h2>全市场排行榜</h2><p id="ranking-description"></p></div>
        <button id="ranking-close" class="ranking-close" type="button">返回个股</button>
      </div>
      <div class="ranking-controls card">
        <div class="ranking-types" id="ranking-types" aria-label="排行榜类型">
          <button class="active" data-ranking-kind="dividend" type="button">历史分红率</button>
          <button data-ranking-kind="performance" type="button">经营业绩</button>
        </div>
        <div class="ranking-years" id="ranking-years" aria-label="时间范围">
          <button data-ranking-years="1" type="button">1年</button>
          <button class="active" data-ranking-years="3" type="button">3年</button>
          <button data-ranking-years="5" type="button">5年</button>
          <button data-ranking-years="10" type="button">10年</button>
        </div>
        <label class="ranking-search" for="ranking-search"><span>⌕</span><input id="ranking-search" type="search" placeholder="在排名中搜索公司、代码或行业" autocomplete="off"></label>
        <div class="ranking-ranges">
          <fieldset class="ranking-range"><legend>总市值（亿元）</legend><input id="ranking-cap-min" type="number" min="0" step="10" inputmode="decimal" placeholder="最低"><span>至</span><input id="ranking-cap-max" type="number" min="0" step="10" inputmode="decimal" placeholder="最高"></fieldset>
          <fieldset class="ranking-range"><legend>PEG</legend><input id="ranking-peg-min" type="number" min="0" step="0.1" inputmode="decimal" placeholder="最低"><span>至</span><input id="ranking-peg-max" type="number" min="0" step="0.1" inputmode="decimal" placeholder="最高"></fieldset>
          <button class="ranking-reset" id="ranking-filter-reset" type="button">重置筛选</button>
        </div>
        <p class="ranking-filter-note">PEG = 当前动态市盈率 ÷ 最新一期归母净利润同比增速；仅正PE、正增长公司有PEG。</p>
      </div>
      <div class="ranking-status" id="ranking-status"></div>
      <div class="ranking-list" id="ranking-list"></div>
      <button class="ranking-more" id="ranking-more" type="button" hidden>加载更多</button>
    </section>

    <article id="company-view" hidden>
      <section class="company-head card">
        <div class="company-title"><div><span class="exchange" id="stock-exchange">—</span><span class="industry" id="stock-industry">—</span></div><h2 id="stock-name">—</h2><p><b id="stock-code">—</b><span id="stock-listing">—</span></p></div>
        <div class="period-chip"><span>最新报告</span><strong id="latest-period">—</strong><small id="latest-notice">—</small></div>
      </section>

      <section class="highlights" id="highlights"></section>

      <section class="card chart-card">
        <div class="section-head"><div><span class="section-kicker">GROWTH</span><h3>营收与归母净利润</h3></div><div class="legend"><span><i class="revenue-dot"></i>营收</span><span><i class="profit-dot"></i>净利润</span></div></div>
        <div id="profit-chart" class="chart"></div>
      </section>

      <nav class="tabs" id="tabs" aria-label="数据分类">
        <button class="active" data-tab="overview">核心财务</button>
        <button data-tab="balance">资产负债</button>
        <button data-tab="cashflow">现金流</button>
        <button data-tab="dividend">分红记录</button>
      </nav>

      <section class="tab-panel active" id="panel-overview"></section>
      <section class="tab-panel" id="panel-balance"></section>
      <section class="tab-panel" id="panel-cashflow"></section>
      <section class="tab-panel" id="panel-dividend"></section>
    </article>

    <section id="error-view" class="error-card" hidden><strong>数据暂时无法读取</strong><p id="error-message"></p><button onclick="location.reload()">重新加载</button></section>
  </main>

  <footer><p>数据来源：东方财富公开接口 · 仅供研究，不构成投资建议</p><p id="generated-at"></p></footer>
  <div class="toast" id="toast"></div>
  <script type="module" src="./app.js"></script>
</body>
</html>
