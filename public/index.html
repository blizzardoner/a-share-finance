<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b1020">
  <meta name="description" content="浏览全部A股上市公司的财务、现金流与分红数据">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="A股透镜">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="stylesheet" href="./styles.css">
  <title>A股透镜 · 财报与分红</title>
</head>
<body>
  <header class="app-header">
    <a class="brand" href="./" aria-label="A股透镜首页"><span class="brand-icon"><i></i><i></i><i></i></span><span><strong>A股透镜</strong><small>FINANCIAL LENS</small></span></a>
    <div class="source-pill"><span></span><b id="data-count">数据加载中</b></div>
  </header>

  <main>
    <section class="intro">
      <p class="eyebrow">A-SHARE INTELLIGENCE</p>
      <h1>一眼看懂公司的<br><em>财务质量与分红。</em></h1>
      <p>覆盖沪深北全部A股，财务指标、现金流、资产负债与历年分红集中浏览。</p>
      <div class="search-wrap">
        <label class="search-box" for="stock-search"><span>⌕</span><input id="stock-search" type="search" placeholder="输入代码、公司名称或拼音" autocomplete="off" enterkeyhint="search"><kbd>搜索</kbd></label>
        <div class="search-results" id="search-results" hidden></div>
      </div>
    </section>

    <section id="loading" class="loading-card"><div class="spinner"></div><strong>正在载入市场数据</strong><span>首次打开只需几秒</span></section>

    <article id="company-view" hidden>
      <section class="company-head card">
        <div class="company-title"><div><span class="exchange" id="stock-exchange">—</span><span class="industry" id="stock-industry">—</span></div><h2 id="stock-name">—</h2><p><b id="stock-code">—</b><span id="stock-listing">—</span></p></div>
        <div class="period-chip"><span>最新报告</span><strong id="latest-period">—</strong><small id="latest-notice">—</small></div>
      </section>

      <section class="highlights" id="highlights"></section>

      <section class="card chart-card">
        <div class="section-head"><div><span class="section-kicker">GROWTH</span><h3>营收与归母净利润</h3></div><div class="legend"><span><i class="revenue-dot"></i>营收</span><span><i class="profit-dot"></i>净利润</span></div></div>
        <div id="profit-chart" class="chart"></div>
      </section>

      <nav class="tabs" id="tabs" aria-label="数据分类">
        <button class="active" data-tab="overview">核心财务</button>
        <button data-tab="balance">资产负债</button>
        <button data-tab="cashflow">现金流</button>
        <button data-tab="dividend">分红记录</button>
      </nav>

      <section class="tab-panel active" id="panel-overview"></section>
      <section class="tab-panel" id="panel-balance"></section>
      <section class="tab-panel" id="panel-cashflow"></section>
      <section class="tab-panel" id="panel-dividend"></section>
    </article>

    <section id="error-view" class="error-card" hidden><strong>数据暂时无法读取</strong><p id="error-message"></p><button onclick="location.reload()">重新加载</button></section>
  </main>

  <footer><p>数据来源：东方财富公开接口 · 仅供研究，不构成投资建议</p><p id="generated-at"></p></footer>
  <div class="toast" id="toast"></div>
  <script type="module" src="./app.js"></script>
</body>
</html>
